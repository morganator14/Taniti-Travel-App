<link rel="stylesheet" href="https://use.typekit.net/gyr7efa.css">
<body>
    <div class="body" id="header">
        <div class="fixed-top">
            <div class="grid">

                <header class="header">
                    <h1 (click)="goToPage('/home')">Travel Taniti</h1>
                </header>

                <nav class="nav">
                    <section class="nav-element" (click)="goToPage('/food')">
                        <h3>Food</h3>
                    </section>
                    <div class="nav-gap"></div>
                    <section class="nav-element" (click)="goToPage('/lodging')">
                        <h3>Lodging</h3>
                    </section>
                    <div class="nav-gap"></div>
                    <section class="nav-element" (click)="goToPage('/activities')">
                        <h3>Activities</h3>
                    </section>
                </nav>
            </div>
        </div>
 
    <section class="scroll-body">
        <main class="activities">
        <section class="activity-option">
            <div>
                <h2 class="activity-name">Snorkeling</h2>
                <p class="activity-text">blurb</p>
            </div>
            <div class="image-reveal">
                <img src="Placeholder_Image.jpg" class="activity-image" id="image-back"/>
                <img src="Placeholder_Image.jpg" class="activity-image" id="image-front"/>
            </div>
        </section> 
        <hr class="activity-divide">   
        <section class="activity-option2">
            <div class="image-reveal">
                <img src="Placeholder_Image.jpg" class="activity-image" id="image-back"/>
                <img src="Placeholder_Image.jpg" class="activity-image" id="image-front"/>
            </div>
            <div>
                <h2 class="activity-name">Volcano Tours</h2>
                <p class="activity-text">blurb</p>
            </div>
        </section>
        <hr class="activity-divide"> 
        <section class="activity-option">
            <div>
                <h2 class="activity-name">Dolphin Viewing</h2>
                <p class="activity-text">blurb</p>
            </div>
            <div class="image-reveal">
                <img src="Placeholder_Image.jpg" class="activity-image" id="image-back"/>
                <img src="Placeholder_Image.jpg" class="activity-image" id="image-front"/>
            </div>
        </section> 
        <hr class="activity-divide">   
        <section class="activity-option2">
            <div class="image-reveal">
                <img src="Placeholder_Image.jpg" class="activity-image" id="image-back"/>
                <img src="Placeholder_Image.jpg" class="activity-image" id="image-front"/>
            </div>
            <div>
                <h2 class="activity-name">Parasailing</h2>
                <p class="activity-text">blurb</p>
            </div>
        </section>
    </main>
    <footer class="footer" id="activity-footer">
        <h2>Questions?</h2>
        <h3>Contact us at tanititravel@taniti.org</h3>
        <a [routerLink]="[]" fragment="header" class="footer-button">Back to Top</a>
        <button class="footer-button" (click)="goToPage('/food')">Food</button>
        <button class="footer-button" (click)="goToPage('/lodging')">Lodging</button>
        <button class="footer-button" (click)="goToPage('/activities')">Activities</button>
        <button class="footer-button" (click)="goToPage('transport')">Transportation</button>
    </footer>
    </section>
        </div>   
</body>
